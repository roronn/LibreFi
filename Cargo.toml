[package]
name = "librefi"
version = "0.1.0"
edition = "2024"

[dependencies]
tiny_http = "0.12.0"
redb = "4.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = { version = "0.10", features = ["aes"] }
base64 = "0.22"
tungstenite = "0.30.0"
rust-embed = { version = "8.12.0" }
rand = "0.8"
sha2 = "0.11"
hmac = "0.13"
ed25519-dalek = "3.0.0"
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"

[dev-dependencies]
ureq = { version = "2.9.1", features = ["json"] }
